name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # 12 saatte bir yenilenir
  workflow_dispatch:          # elle tetikleme
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Veri cekmek icin kisisel token (asagidaki adimlarda olusturulacak)
          token: ${{ secrets.METRICS_TOKEN }}
          # Dosyayi repoya yazmak icin otomatik token
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: Cavitbatusoylu
          filename: github-metrics.svg
          template: classic
          base: header, repositories, metadata
          config_timezone: Europe/Istanbul

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github