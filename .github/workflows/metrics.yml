name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # 12 saatte bir yenilenir
  workflow_dispatch:          # elle de tetiklenebilir
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Cavitbatusoylu
          filename: github-metrics.svg
          template: classic
          base: header, repositories, metadata
          config_timezone: Europe/Istanbul
          config_display: large

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github

          plugin_achievements: yes
          plugin_achievements_only: developer, maintainer, stargazer, sponsor
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact